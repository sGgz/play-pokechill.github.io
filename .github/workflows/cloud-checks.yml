name: Cloud save checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: npm ci
      - run: npm run android:prepare
        env:
          POKECHILL_ORIGIN: https://game.example.com
      - run: bash ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --console=plain
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: pokechill-android-example-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
